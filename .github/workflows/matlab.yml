name: MATLAB pruebas y analisis
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  importar-historial:
    if: github.event_name == 'push' && github.run_number == 1
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Incorporar los cuatro commits originales del equipo
        run: |
          git config user.name 'German Arturo Chipana Jeronimo'
          git config user.email 'gchipanaj@unsa.edu.pe'
          git fetch ./historial.bundle main
          git merge --allow-unrelated-histories -s ours --no-edit FETCH_HEAD
          git push origin HEAD:main
  matlab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
      - name: Pruebas numericas sin Internet
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests'); run_tests
      - name: Analisis de datos reales
        uses: matlab-actions/run-command@v3
        with:
          command: main
      - name: Conservar resultados y datos de esta edicion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analisis-matlab-${{ github.sha }}
          path: |
            results/
            data/
          retention-days: 30
